version: '3'

rpc:
  listen: tcp://127.0.0.1:6001

server:
  command: "php vendor/laravel/octane/bin/roadrunner-worker"
  env:
    APP_BASE_PATH: "."
    LARAVEL_OCTANE: "1"

http:
  address: 127.0.0.1:8080
  middleware: ["static"]
  static:
    dir: "public"
    forbid: [".php", ".htaccess"]
  pool:
    num_workers: 16
    max_jobs: 500

logs:
  mode: production
  level: warn
  output: stdout
